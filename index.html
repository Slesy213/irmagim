<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Irmağım ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:Poppins,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  button{font-family:inherit;color:inherit}

  /* ---------- Tablet çerçevesi ---------- */
  #tablet{position:fixed;inset:0;height:100%;padding:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 20%,#1a1d27,#000 75%)}
  .bezel{position:relative;height:100%;border-radius:38px;background:#14151a;border:2px solid #3b3d47;padding:26px 11px 30px;box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.7)}
  .cam{position:absolute;top:9px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#262831;border:1px solid #3b3d47}
  #homebar{position:absolute;bottom:9px;left:50%;width:120px;height:14px;margin-left:-60px;border:0;background:none;padding:0;cursor:pointer}
  #homebar::after{content:"";position:absolute;left:0;right:0;top:4px;height:5px;border-radius:3px;background:#8e909a}
  .screen{position:relative;height:100%;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 75% 25%,#1c2333 0,#06070b 70%)}

  /* ---------- Ana ekran ---------- */
  .home{position:absolute;inset:0;padding:60px 14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .card{border:1px solid rgba(255,255,255,.17);background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.04));border-radius:18px;padding:14px 18px;margin-bottom:12px}
  .gunadi{color:#ff6b5e;font-weight:600;font-size:12px;letter-spacing:.06em}
  .saat{font-size:clamp(40px,12vw,54px);font-weight:600;line-height:1.1;color:#f1f1f5}
  .saat small{font-size:.45em;color:#8e909a;font-weight:600}
  .tarih{color:#a4a6b0;font-size:14px;font-weight:600;margin-top:2px}
  .card h3{margin:0 0 6px;font-size:20px}
  .card h4{margin:0 0 6px;font-size:14px}
  .card p{margin:0;font-size:12.5px;line-height:1.5;color:#a4a6b0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;margin-top:20px}
  .ik{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;line-height:1.25;text-align:center}
  .ik i{display:grid;place-items:center;width:62px;height:62px;border-radius:18px;font-style:normal;font-size:30px;box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
  .ik:active i{transform:scale(.9)}
  .i1{background:linear-gradient(145deg,#ff5a75,#c4112f)}
  .i2{background:linear-gradient(145deg,#b877ff,#6a35d8)}
  .i3{background:linear-gradient(145deg,#37c5c9,#1478b8)}

  /* ---------- Uygulama katmanları ---------- */
  .app{position:absolute;inset:0;background:#07080c;overflow:hidden;visibility:hidden;opacity:0;transform:scale(.3);border-radius:30px;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s,border-radius .45s,visibility 0s .45s}
  .app.open{visibility:visible;opacity:1;transform:none;border-radius:0;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,border-radius .45s,visibility 0s}
  .back,#ses{position:absolute;top:12px;z-index:12;height:38px;border-radius:13px;border:1px solid rgba(255,255,255,.22);background:rgba(36,38,46,.72);font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .back{left:12px;padding:0 15px}
  #ses{right:12px;width:38px;font-size:17px;padding:0}

  /* Kalp uygulaması */
  .bgblur{position:absolute;inset:-6%;background:#000 url(foto.jpg) center/cover no-repeat;filter:blur(30px) brightness(.32)}
  .bg{position:absolute;inset:0;background:url(foto.jpg) center/contain no-repeat;filter:brightness(.5) contrast(1.05);animation:kb 30s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.04)}}
  .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 36%,rgba(0,0,0,0) 0,rgba(0,0,0,.6) 100%),linear-gradient(transparent 55%,rgba(0,0,0,.8))}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .baslik{position:absolute;left:0;right:0;top:63%;text-align:center;padding:0 16px;opacity:0;transform:translateY(16px);transition:opacity 1.8s,transform 1.8s;pointer-events:none}
  .baslik.on{opacity:1;transform:none}
  .baslik h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(28px,8vw,56px);line-height:1.15;text-shadow:0 0 22px rgba(255,40,70,.65),0 2px 12px rgba(0,0,0,.8)}
  .gun{position:absolute;left:0;right:0;bottom:5%;display:flex;justify-content:center;opacity:0;transition:opacity 2s .6s;pointer-events:none}
  .gun.on{opacity:1}
  .gun div{display:flex;align-items:baseline;gap:10px;padding:8px 24px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:16px;color:#e9d5d9}
  .gun b{font-size:clamp(28px,8vw,42px);background:linear-gradient(#ff6b81,#e5173f);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* Sayfa başlıkları */
  .sayfa{position:absolute;inset:0;padding:64px 20px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(ellipse at 50% 0,#2a1020,#07080c 60%)}
  .sayfa h2{margin:0 0 22px;text-align:center;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(28px,8vw,40px);text-shadow:0 0 20px rgba(255,40,70,.5)}

  /* Osman-Irmak */
  .zaman{position:relative;margin:0 0 24px 14px;padding-left:28px;border-left:2px solid rgba(255,90,117,.5)}
  .olay{position:relative;padding:4px 0 30px}
  .olay:last-child{padding-bottom:4px}
  .olay::before{content:"";position:absolute;left:-37px;top:12px;width:16px;height:16px;border-radius:50%;background:#ff5a75;box-shadow:0 0 0 5px rgba(255,90,117,.2),0 0 16px #ff2846}
  .olay b{display:block;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(28px,8vw,38px);line-height:1.2}
  .olay span{color:#e9d5d9;font-size:16px}
  .birlikte{text-align:center}
  .birlikte b{display:block;font-size:46px;line-height:1.1;background:linear-gradient(#ff6b81,#e5173f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .birlikte span{color:#a4a6b0;font-size:13px}

  /* Fotoğraflar */
  .galeri{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .galeri button{padding:0;border:0;border-radius:16px;overflow:hidden;aspect-ratio:1;background:#14151a;cursor:pointer}
  .galeri img{width:100%;height:100%;object-fit:cover;display:block}
  .bos{display:grid;place-items:center;aspect-ratio:1;border-radius:16px;border:1.5px dashed rgba(255,255,255,.2);font-size:30px;color:#6b6d78}
  .not{text-align:center;color:#a4a6b0;font-size:13px;margin:18px 0 0}
  .lb{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:14px}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:12px}

  /* Başlangıç ekranı */
  #start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px;text-align:center;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;transition:opacity .9s}
  #start.gone{opacity:0;pointer-events:none}
  #start .k{font-size:64px;animation:at 1.2s ease-in-out infinite}
  @keyframes at{50%{transform:scale(1.15)}}
  #start p{margin:0;font-size:17px;color:#e9d5d9;letter-spacing:.04em}
  @media (prefers-reduced-motion:reduce){.bg,#start .k{animation:none}}
</style>
</head>
<body>

<div id="tablet"><div class="bezel">
  <div class="cam"></div>
  <div class="screen" id="screen">

    <!-- Ana ekran -->
    <div class="home">
      <div class="card">
        <div class="gunadi" id="gunadi"></div>
        <div class="saat"><span id="hm"></span><small id="sn"></small></div>
        <div class="tarih" id="tarih"></div>
      </div>
      <div class="card">
        <h3>Irmak Tableti</h3>
        <h4>Sana özel giriş paneli</h4>
        <p>Bir uygulamayı aç, tek dokunuşla içeri geç.</p>
      </div>
      <div class="grid">
        <button class="ik" data-app="kalp"><i class="i1">❤</i>Irmağım</button>
        <button class="ik" data-app="biz"><i class="i2">💞</i>Osman-Irmak</button>
        <button class="ik" data-app="foto"><i class="i3">📷</i>Fotoğraflarımız</button>
      </div>
    </div>

    <!-- Irmağım (kalp animasyonu) -->
    <div class="app" id="kalp">
      <div class="bgblur"></div><div class="bg"></div><div class="shade"></div>
      <canvas id="c"></canvas>
      <div class="baslik" id="b"><h1 id="bt"></h1></div>
      <div class="gun" id="g"><div><b id="gn"></b> Gün</div></div>
      <button class="back">‹ Geri</button>
    </div>

    <!-- Osman-Irmak -->
    <div class="app" id="biz">
      <div class="sayfa">
        <h2>Osman ❤ Irmak</h2>
        <div class="zaman">
          <div class="olay"><b>17 Eylül</b><span>Tanışma</span></div>
          <div class="olay"><b>24 Eylül</b><span>Sevgili tarihimiz</span></div>
        </div>
        <div class="card birlikte"><b id="gn2"></b><span>gündür birlikteyiz</span></div>
      </div>
      <button class="back">‹ Geri</button>
    </div>

    <!-- Fotoğraflarımız -->
    <div class="app" id="foto">
      <div class="sayfa">
        <h2>Fotoğraflarımız</h2>
        <div class="galeri" id="galeri"></div>
        <p class="not" id="not"></p>
      </div>
      <div class="lb" id="lb"><img id="lbi" alt=""></div>
      <button class="back">‹ Geri</button>
    </div>

    <button id="ses" aria-label="Sesi aç/kapat">🔊</button>
  </div>
  <button id="homebar" aria-label="Ana ekran"></button>
</div></div>

<div id="start"><div class="k">❤</div><p>Sana bir şey hazırladım<br>başlamak için dokun</p></div>
<audio id="a" src="sarki.mp3" loop preload="auto"></audio>

<script>
/* ===== AYARLAR ===== */
const AYARLAR = {
  baslik: 'Senii seviyorummm Irmagımm',
  baslangic: '2026-09-24'   // sevgili olduğunuz gün; gün sayısı her gün kendiliğinden artar
};
/* Fotoğraf eklemek için dosyaları index.html ile aynı klasöre koy ve adlarını buraya yaz:
   const FOTOLAR = ['f1.jpg','f2.jpg','f3.jpg']; */
const FOTOLAR = ['f1.jpg','f2.jpg','f3.jpg'];
/* =================== */

const $ = id => document.getElementById(id);
const screenEl = $('screen'), audio = $('a');

/* ---- saat ---- */
function saat(){
  const d = new Date();
  $('gunadi').textContent = d.toLocaleDateString('tr-TR',{weekday:'long'}).toLocaleUpperCase('tr-TR');
  $('hm').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  $('sn').textContent = ':' + String(d.getSeconds()).padStart(2,'0');
  $('tarih').textContent = d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
}
saat(); setInterval(saat, 1000);

/* ---- gün sayısı ---- */
const [y,m,dd] = AYARLAR.baslangic.split('-').map(Number);
const bugun = new Date(); bugun.setHours(0,0,0,0);
const gun = Math.max(0, Math.round((bugun - new Date(y, m-1, dd)) / 864e5));
$('gn').textContent = gun; $('gn2').textContent = gun;
$('bt').textContent = AYARLAR.baslik;

/* ---- fotoğraf galerisi ---- */
const gal = $('galeri');
if (FOTOLAR.length) {
  FOTOLAR.forEach(src => {
    const bt = document.createElement('button'), im = document.createElement('img');
    im.src = src; im.loading = 'lazy'; im.alt = ''; bt.appendChild(im);
    bt.onclick = () => { $('lbi').src = src; $('lb').classList.add('on'); };
    gal.appendChild(bt);
  });
} else {
  for (let i = 0; i < 6; i++) { const d = document.createElement('div'); d.className = 'bos'; d.textContent = '📷'; gal.appendChild(d); }
  $('not').textContent = 'Fotoğraflarımız yakında burada olacak ❤';
}
$('lb').onclick = () => $('lb').classList.remove('on');

/* ---- uygulama aç / kapat ---- */
let cur = null;
function openApp(id, icon){
  const app = $(id), s = screenEl.getBoundingClientRect(), r = icon.getBoundingClientRect();
  app.style.transformOrigin = (r.left + r.width/2 - s.left) + 'px ' + (r.top + r.height/2 - s.top) + 'px';
  app.classList.add('open'); cur = id;
  if (id === 'kalp') { fit(); textShown = false; $('b').classList.remove('on'); $('g').classList.remove('on'); setTimeout(() => go(0), 350); }
}
function closeApp(){
  if (!cur) return;
  $(cur).classList.remove('open');
  if (cur === 'kalp') phase = -1;
  $('lb').classList.remove('on');
  cur = null;
}
document.querySelectorAll('.ik').forEach(b => b.addEventListener('click', () => openApp(b.dataset.app, b)));
document.querySelectorAll('.back').forEach(b => b.addEventListener('click', closeApp));
$('homebar').addEventListener('click', closeApp);

/* ---- ses ---- */
const sb = $('ses');
sb.addEventListener('click', () => { audio.muted = !audio.muted; sb.textContent = audio.muted ? '🔇' : '🔊'; });

/* ---- kalp animasyonu ---- */
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, D, S;
function fit(){
  D = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.max(1, cv.clientWidth * D); H = cv.height = Math.max(1, cv.clientHeight * D);
  S = Math.min(W * 0.86, H * 0.5) / 34;
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250)); fit();

const N = 160, pts = [];
for (let i = 0; i <= N; i++) {
  const t = i / N * Math.PI * 2;
  pts.push([16 * Math.pow(Math.sin(t), 3),
           -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);
}
const tip = pts[N / 2];
const CY = 2.5;

const PN = 900, P = [];
for (let n = 0; n < PN; n++) {
  const i = Math.floor(Math.random() * N), u = Math.random();
  const from = n % 2 ? tip : pts[i], to = n % 2 ? pts[i] : pts[N - i];
  const hx = from[0] + (to[0] - from[0]) * u, hy = from[1] + (to[1] - from[1]) * u;
  const ang = Math.atan2(hy - CY, hx) + (Math.random() - .5) * .9;
  const sp = 7 + Math.random() * 22;
  P.push({ hx, hy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: .1 + Math.random() * .22, h: 346 + Math.random() * 16, l: 50 + Math.random() * 14 });
}

let phase = -1, t0 = 0, textShown = false;
const go = p => { phase = p; t0 = performance.now(); };
const beatF = now => 1 + .035 * Math.pow(Math.max(0, Math.sin(now / 1000 * 2.6)), 6);
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function showText(){
  if (textShown) return; textShown = true;
  $('b').classList.add('on'); $('g').classList.add('on');
}

function draw(now){
  requestAnimationFrame(draw);
  if (phase < 0) { if (W) { ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); } return; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const el = now - t0;
  let lineK = 0, lineA = 1, beat = 1, pMode = 0, pr = 0, glow = 0, flash = 0;

  if (phase === 0) { const p = Math.min(el / 6500, 1); lineK = p * N; glow = p * .6; if (p > .85) showText(); if (p >= 1) go(1); }
  else if (phase === 1) { lineK = N; beat = beatF(now); glow = 1; if (el > 2600) go(2); }
  else if (phase === 2) { pr = Math.min(el / 2400, 1); pMode = 2; lineK = N; lineA = Math.max(0, 1 - el / 260); flash = Math.max(0, 1 - el / 500); glow = lineA * .8; if (pr >= 1) go(3); }
  else if (phase === 3) { pr = Math.min(el / 2400, 1); pMode = 3; glow = easeIO(pr) * .5; if (pr >= 1) go(4); }
  else if (phase === 4) { pr = Math.min(el / 2200, 1); pMode = 4; lineK = pr * N; glow = .5 + pr * .5; if (pr >= 1) go(5); }
  else { lineK = N; beat = beatF(now); glow = 1; }

  ctx.translate(W / 2, H * 0.34);
  ctx.scale(S * beat, S * beat);
  ctx.translate(0, -CY);
  ctx.globalCompositeOperation = 'lighter';

  if (glow > 0) {
    const g = ctx.createRadialGradient(0, CY, 0, 0, CY, 24);
    g.addColorStop(0, 'rgba(255,30,60,' + (.2 * glow) + ')'); g.addColorStop(1, 'rgba(255,30,60,0)');
    ctx.fillStyle = g; ctx.fillRect(-30, -26, 60, 60);
  }
  if (flash > 0) {
    const g = ctx.createRadialGradient(0, CY, 0, 0, CY, 22 * (1.2 - flash * .4));
    g.addColorStop(0, 'rgba(255,200,205,' + (.7 * flash) + ')'); g.addColorStop(1, 'rgba(255,30,60,0)');
    ctx.fillStyle = g; ctx.fillRect(-30, -26, 60, 60);
  }
  if (lineA > 0 && lineK > 0) {
    ctx.globalAlpha = lineA;
    ctx.lineWidth = 1.15 * D / (S * beat);
    const k = Math.floor(lineK);
    for (let i = 0; i < k; i++) {
      ctx.strokeStyle = 'hsla(' + (350 + (i / N) * 10) + ',95%,' + (i % 2 ? 58 : 48) + '%,.55)';
      ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[N - i][0], pts[N - i][1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (pMode) {
    let E, A;
    if (pMode === 2) { E = 1 - Math.pow(1 - pr, 3); A = Math.pow(1 - pr, 1.2); }
    else if (pMode === 3) { E = 1 - easeIO(pr); A = .15 + .85 * easeIO(pr); }
    else { E = 0; A = 1 - pr; }
    for (let i = 0; i < PN; i++) {
      const q = P[i];
      ctx.fillStyle = 'hsla(' + q.h + ',95%,' + q.l + '%,' + A + ')';
      ctx.beginPath(); ctx.arc(q.hx + q.vx * E, q.hy + q.vy * E, q.r, 0, 6.2832); ctx.fill();
    }
  }
}
requestAnimationFrame(draw);

/* animasyon bitince dokununca yeniden oynat */
$('kalp').addEventListener('pointerdown', e => { if (phase === 5 && !e.target.closest('.back')) go(2); });

/* başlat (tarayıcılar sesi dokunmadan çalmaya izin vermez) */
$('start').addEventListener('click', () => {
  audio.volume = .9; audio.play().catch(() => {});
  $('start').classList.add('gone');
});
</script>
</body>
</html>
