<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irmağım ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:Poppins,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  .bgblur{position:fixed;inset:-6%;background:#000 url(foto.jpg) center/cover no-repeat;filter:blur(30px) brightness(.32)}
  .bg{position:fixed;inset:0;background:url(foto.jpg) center/contain no-repeat;filter:brightness(.5) contrast(1.05);animation:kb 30s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.04)}}
  .shade{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 36%,rgba(0,0,0,0) 0,rgba(0,0,0,.6) 100%),linear-gradient(transparent 55%,rgba(0,0,0,.8))}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .baslik{position:fixed;left:0;right:0;top:63%;text-align:center;padding:0 18px;opacity:0;transform:translateY(16px);transition:opacity 1.8s,transform 1.8s;pointer-events:none}
  .baslik.on{opacity:1;transform:none}
  .baslik h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(30px,7.2vw,64px);line-height:1.15;text-shadow:0 0 22px rgba(255,40,70,.65),0 2px 12px rgba(0,0,0,.8)}
  .gun{position:fixed;left:0;right:0;bottom:calc(5% + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;opacity:0;transition:opacity 2s .6s}
  .gun.on{opacity:1}
  .gun div{display:flex;align-items:baseline;gap:10px;padding:10px 26px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:clamp(15px,3vw,20px);color:#e9d5d9}
  .gun b{font-size:clamp(28px,6vw,44px);background:linear-gradient(#ff6b81,#e5173f);-webkit-background-clip:text;background-clip:text;color:transparent}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;transition:opacity .9s}
  #start.gone{opacity:0;pointer-events:none}
  #start .k{font-size:64px;animation:at 1.2s ease-in-out infinite}
  @keyframes at{50%{transform:scale(1.15)}}
  #start p{margin:0;font-size:17px;color:#e9d5d9;letter-spacing:.04em}
  #ses{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:4;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="bgblur"></div><div class="bg"></div><div class="shade"></div>
<canvas id="c"></canvas>
<div class="baslik" id="b"><h1 id="bt"></h1></div>
<div class="gun" id="g"><div><b id="gn"></b> Gün</div></div>
<button id="ses" aria-label="Sesi aç/kapat">🔊</button>
<div id="start"><div class="k">❤</div><p>Sana bir şey hazırladım · başlamak için dokun</p></div>
<audio id="a" src="sarki.mp3" loop preload="auto"></audio>

<script>
/* ===== AYARLAR ===== */
const AYARLAR = {
  baslik: 'Senii seviyorummm Irmagımm',
  gun: 53,            // sabit gün sayısı
  baslangic: ''       // doluysa (örn. '2026-09-24') gün sayısı her gün kendiliğinden artar
};
/* =================== */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const audio = document.getElementById('a');
let W, H, D, S;
function fit(){
  D = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * D; H = cv.height = innerHeight * D;
  S = Math.min(W * 0.86, H * 0.5) / 34;
}
addEventListener('resize', fit); fit();

// yazılar
document.getElementById('bt').textContent = AYARLAR.baslik;
let gun = AYARLAR.gun;
if (AYARLAR.baslangic) gun = Math.max(0, Math.floor((Date.now() - new Date(AYARLAR.baslangic)) / 864e5));
document.getElementById('gn').textContent = gun;

// kalp eğrisi ve çizgiler
const N = 160, pts = [];
for (let i = 0; i <= N; i++) {
  const t = i / N * Math.PI * 2;
  pts.push([16 * Math.pow(Math.sin(t), 3),
           -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);
}
const tip = pts[N / 2];
const CY = 2.5;

// parçacıklar (patlama için)
const PN = 900, P = [];
for (let n = 0; n < PN; n++) {
  const i = Math.floor(Math.random() * N), u = Math.random();
  const a = tip, b = n % 2 ? pts[i] : pts[N - i], c = n % 2 ? tip : pts[i];
  const from = n % 2 ? tip : pts[i], to = n % 2 ? pts[i] : pts[N - i];
  const hx = from[0] + (to[0] - from[0]) * u, hy = from[1] + (to[1] - from[1]) * u;
  const ang = Math.atan2(hy - CY, hx) + (Math.random() - .5) * .9;
  const sp = 7 + Math.random() * 22;
  P.push({ hx, hy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: .1 + Math.random() * .22, h: 346 + Math.random() * 16, l: 50 + Math.random() * 14 });
}

// aşamalar: 0 çizim, 1 atış, 2 patlama, 3 toplanma, 4 yeniden çizim, 5 atış (sürekli)
let phase = -1, t0 = 0, textShown = false;
const go = p => { phase = p; t0 = performance.now(); };
const beatF = now => 1 + .035 * Math.pow(Math.max(0, Math.sin(now / 1000 * 2.6)), 6);
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function showText(){
  if (textShown) return; textShown = true;
  document.getElementById('b').classList.add('on');
  document.getElementById('g').classList.add('on');
}

function draw(now){
  requestAnimationFrame(draw);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (phase < 0) return;

  const el = now - t0;
  let lineK = 0, lineA = 1, beat = 1, pMode = 0, pr = 0, glow = 0, flash = 0;

  if (phase === 0) { const p = Math.min(el / 6500, 1); lineK = p * N; glow = p * .6; if (p > .85) showText(); if (p >= 1) go(1); }
  else if (phase === 1) { lineK = N; beat = beatF(now); glow = 1; if (el > 2600) go(2); }
  else if (phase === 2) { pr = Math.min(el / 2400, 1); pMode = 2; lineK = N; lineA = Math.max(0, 1 - el / 260); flash = Math.max(0, 1 - el / 500); glow = lineA * .8; if (pr >= 1) go(3); }
  else if (phase === 3) { pr = Math.min(el / 2400, 1); pMode = 3; glow = easeIO(pr) * .5; if (pr >= 1) go(4); }
  else if (phase === 4) { pr = Math.min(el / 2200, 1); pMode = 4; lineK = pr * N; glow = .5 + pr * .5; if (pr >= 1) go(5); }
  else { lineK = N; beat = beatF(now); glow = 1; }

  ctx.translate(W / 2, H * 0.34);
  ctx.scale(S * beat, S * beat);
  ctx.translate(0, -CY);
  ctx.globalCompositeOperation = 'lighter';

  // yumuşak kırmızı ışık
  if (glow > 0) {
    const g = ctx.createRadialGradient(0, CY, 0, 0, CY, 24);
    g.addColorStop(0, 'rgba(255,30,60,' + (.2 * glow) + ')'); g.addColorStop(1, 'rgba(255,30,60,0)');
    ctx.fillStyle = g; ctx.fillRect(-30, -26, 60, 60);
  }
  // patlama anındaki parlama
  if (flash > 0) {
    const g = ctx.createRadialGradient(0, CY, 0, 0, CY, 22 * (1.2 - flash * .4));
    g.addColorStop(0, 'rgba(255,200,205,' + (.7 * flash) + ')'); g.addColorStop(1, 'rgba(255,30,60,0)');
    ctx.fillStyle = g; ctx.fillRect(-30, -26, 60, 60);
  }
  // çizgiler (sadece kırmızı)
  if (lineA > 0 && lineK > 0) {
    ctx.globalAlpha = lineA;
    ctx.lineWidth = 1.15 * D / (S * beat);
    const k = Math.floor(lineK);
    for (let i = 0; i < k; i++) {
      ctx.strokeStyle = 'hsla(' + (350 + (i / N) * 10) + ',95%,' + (i % 2 ? 58 : 48) + '%,.55)';
      ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[N - i][0], pts[N - i][1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // parçacıklar
  if (pMode) {
    let E, A;
    if (pMode === 2) { E = 1 - Math.pow(1 - pr, 3); A = Math.pow(1 - pr, 1.2); }
    else if (pMode === 3) { E = 1 - easeIO(pr); A = .15 + .85 * easeIO(pr); }
    else { E = 0; A = 1 - pr; }
    for (let i = 0; i < PN; i++) {
      const q = P[i];
      ctx.fillStyle = 'hsla(' + q.h + ',95%,' + q.l + '%,' + A + ')';
      ctx.beginPath(); ctx.arc(q.hx + q.vx * E, q.hy + q.vy * E, q.r, 0, 6.2832); ctx.fill();
    }
  }
}
requestAnimationFrame(draw);

// başlat (tarayıcılar sesi dokunmadan çalmaya izin vermez)
const ov = document.getElementById('start');
ov.addEventListener('click', () => {
  audio.volume = .9; audio.play().catch(() => {});
  ov.classList.add('gone'); go(0);
});
// ses aç/kapat
const sb = document.getElementById('ses');
sb.addEventListener('click', e => { e.stopPropagation(); audio.muted = !audio.muted; sb.textContent = audio.muted ? '🔇' : '🔊'; });
// animasyon bitince dokununca yeniden oynat
addEventListener('pointerdown', e => { if (phase === 5 && e.target !== sb) go(2); });
</script>
</body>
</html>
